name: Clerk Tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: clerk-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
  CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
  E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
  E2E_CLERK_ADMIN_EMAIL: ${{ secrets.E2E_CLERK_ADMIN_EMAIL }}
  E2E_CLERK_ADMIN_PASSWORD: ${{ secrets.E2E_CLERK_ADMIN_PASSWORD }}
  EMAIL_SERVICE_ENABLED: 'false'
  EMAIL_MARKETING_ENABLED: 'false'
  TEST_CLERK_USER_ID: ${{ secrets.TEST_CLERK_USER_ID }}
  RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
  RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
  RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
  BILLING_PROVIDER: razorpay
  BILLING_ENABLED: 'true'

jobs:
  configuration:
    name: Check Clerk test configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integration_ready: ${{ steps.check.outputs.integration_ready }}
      extended_ready: ${{ steps.check.outputs.extended_ready }}
      billing_ready: ${{ steps.check.outputs.billing_ready }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check required configuration without exposing values
        id: check
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const common = [
            'CLERK_PUBLISHABLE_KEY', 'CLERK_SECRET_KEY', 'DATABASE_URL', 'ADMIN_EMAIL',
            'E2E_CLERK_USER_EMAIL', 'E2E_CLERK_USER_PASSWORD',
            'E2E_CLERK_ADMIN_EMAIL', 'E2E_CLERK_ADMIN_PASSWORD',
          ]
          const extendedRequested = ['schedule', 'workflow_dispatch'].includes(process.env.WORKFLOW_EVENT)
          const groups = [
            { output: 'integration_ready', label: 'Clerk API, webhook and browser smoke tests', requested: ['pull_request', 'workflow_dispatch'].includes(process.env.WORKFLOW_EVENT), required: [...common, 'CLERK_WEBHOOK_SECRET'] },
            { output: 'extended_ready', label: 'Clerk browser extended tests', requested: extendedRequested, required: common },
            { output: 'billing_ready', label: 'Legacy Razorpay provider smoke test', requested: extendedRequested, required: [...common, 'TEST_CLERK_USER_ID', 'RAZORPAY_KEY_ID', 'RAZORPAY_KEY_SECRET', 'RAZORPAY_WEBHOOK_SECRET'] },
          ]
          const summary = [
            '## Clerk test configuration',
            '',
            'This job checks configuration only. It does not run or pass authentication, browser, database, or provider-backed tests.',
            'Jobs with missing configuration are explicitly skipped. Course structural tests run in the separate Course Tests workflow without credentials.',
            '',
            '| Coverage | Configuration / execution | Missing configuration names |',
            '| --- | --- | --- |',
          ]
          for (const group of groups) {
            const missing = group.required.filter(name => !process.env[name]?.trim())
            const ready = missing.length === 0
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${group.output}=${ready}\n`)
            const status = !group.requested ? 'Not requested by this trigger' : ready ? 'Configured; see the test job for its result' : '**SKIPPED — not executed**'
            summary.push(`| ${group.label} | ${status} | ${missing.join(', ') || 'None'} |`)
            if (group.requested && !ready) {
              console.log(`::warning title=Test coverage skipped::${group.label} will not run. Missing configuration: ${missing.join(', ')}. No authentication coverage is claimed.`)
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`)
          NODE

  clerk-integration:
    needs: configuration
    if: ${{ needs.configuration.outputs.integration_ready == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Clerk API smoke tests
        run: npm run test:clerk:api

      - name: Run Clerk webhook integration tests
        run: npm run test:clerk:webhooks

      - name: Run Clerk Playwright smoke tests
        run: npm run test:e2e:clerk -- --grep @smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  clerk-extended:
    needs: configuration
    if: ${{ needs.configuration.outputs.extended_ready == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Clerk Playwright extended tests
        run: npm run test:e2e:clerk -- --grep @extended

      - name: Run provider-backed billing smoke
        if: ${{ needs.configuration.outputs.billing_ready == 'true' }}
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/clerk-billing-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in $(seq 1 60); do
            if curl -sSf http://127.0.0.1:3000/sign-in > /dev/null; then
              break
            fi
            sleep 2
          done
          npm run billing:test-e2e -- --user-id "$TEST_CLERK_USER_ID"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-extended
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
